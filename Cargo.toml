[package]
name = "anasemble"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.97"
description = "Evidence-bound service reconstruction and disaster recovery"
license = "Apache-2.0"
repository = "https://github.com/kabudu/anasemble"
homepage = "https://github.com/kabudu/anasemble"
documentation = "https://github.com/kabudu/anasemble/tree/master/docs"
readme = "README.md"
keywords = ["disaster-recovery", "reconstruction", "resilience"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
futures-util = "0.3.33"
hex = "0.4.3"
hmac = "0.13.0"
jiff = "0.2.35"
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
postgres = "0.19.14"
redis = { version = "1.5.0", features = ["tls-rustls"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
url = "2.5.7"
wasm-encoder = { version = "0.256.0", default-features = false, features = ["std"] }
wasmi = { version = "1.1.0", default-features = false, features = ["std", "prefer-btree-collections"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"
