name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated tag to publish; empty performs a build-only dry run
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  binaries:
    if: github.repository == 'kabudu/anasemble'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate tag and build native binary
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${GITHUB_REF_TYPE}" = tag ] || [ -n "${{ inputs.release_tag }}" ]; then test "${RELEASE_TAG}" = "v${version}"; fi
          rustup toolchain install 1.97.0 --profile minimal
          rustup target add "${{ matrix.target }}"
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          cargo build --release --locked --target "${{ matrix.target }}"
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Assemble bounded release archive
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          root="anasemble-v${version}-linux-${{ matrix.arch }}"
          binary="target/${{ matrix.target }}/release/anasemble"
          mkdir -p "dist/${root}"
          cp "${binary}" LICENSE NOTICE TRADEMARKS.md release/BINARY_INSTALLATION.md "dist/${root}/"
          install_prefix="${RUNNER_TEMP}/anasemble-install-${{ matrix.arch }}"
          "${binary}" install "${install_prefix}" >/dev/null
          cp "${install_prefix}/share/compatibility-v2.json" "dist/${root}/"
          "${install_prefix}/bin/anasemble" uninstall "${install_prefix}" >/dev/null
          tar -C dist -czf "dist/${root}.tar.gz" "${root}"
          digest=$(sha256sum "dist/${root}.tar.gz" | cut -d' ' -f1)
          jq -n \
            --arg version "v${version}" \
            --arg commit "${GITHUB_SHA}" \
            --arg arch "${{ matrix.arch }}" \
            --arg toolchain "$(rustc --version)" \
            --arg command "cargo build --release --locked --target ${{ matrix.target }}" \
            --arg digest "${digest}" \
            '{schema:"anasemble-build-provenance-v1",version:$version,commit:$commit,target:("linux-"+$arch),toolchain:$toolchain,command:$command,sha256:$digest}' \
            > "dist/${root}.provenance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.provenance.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: binaries
    if: github.repository == 'kabudu/anasemble' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate the clean crates.io package
        run: cargo package --locked
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate and stage the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          test "${RELEASE_TAG}" = "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          (cd dist && sha256sum * | sort -k2 > SHA256SUMS)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --draft \
              --prerelease \
              --title "$(cat "release/${version}.title")" \
              --notes-file "release/${version}.md"
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --draft \
              --prerelease \
              --title "$(cat "release/${version}.title")" \
              --notes-file "release/${version}.md"
          fi
          mv dist "${RUNNER_TEMP}/release-assets"
      - name: Publish the Rust crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Publish the staged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --verify-tag
