[package]
name = "anasemble-events"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.97"
description = "Append-only reconstruction and certification event protocol"
license = "Apache-2.0"
repository = "https://github.com/kabudu/anasemble"
publish = false

[dependencies]
anasemble-core = { path = "../anasemble-core", version = "0.1.0-rc.1" }
anasemble-evidence = { path = "../anasemble-evidence", version = "0.1.0-rc.1" }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"
