[package]
name = "anasemble-evidence"
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.97"
description = "Generic evidence envelopes, provenance, signatures, and seals"
license = "Apache-2.0"
repository = "https://github.com/kabudu/anasemble"
homepage = "https://github.com/kabudu/anasemble"
keywords = ["evidence", "ed25519", "envelope"]
categories = ["cryptography", "encoding"]
publish = ["crates-io"]

[dependencies]
anasemble-core = { path = "../anasemble-core", version = "0.1.0-rc.3" }
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
zeroize = "1.9.0"

[lints.rust]
unsafe_code = "forbid"
