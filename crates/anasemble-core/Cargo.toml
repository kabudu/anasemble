[package]
name = "anasemble-core"
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.97"
description = "Canonical values, digests, and bounded identifiers for Anasemble"
license = "Apache-2.0"
repository = "https://github.com/kabudu/anasemble"
homepage = "https://github.com/kabudu/anasemble"
keywords = ["evidence", "digest", "cbor"]
categories = ["encoding", "data-structures"]
publish = ["crates-io"]

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["serde", "v7"] }

[lints.rust]
unsafe_code = "forbid"
