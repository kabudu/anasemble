[package]
name = "anasemble-contract"
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.97"
description = "Contract versions, compatibility, and migration obligations"
license = "Apache-2.0"
repository = "https://github.com/kabudu/anasemble"
homepage = "https://github.com/kabudu/anasemble"
keywords = ["contract", "compatibility", "evidence"]
