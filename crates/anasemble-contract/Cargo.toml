publish = ["crates-io"]

[dependencies]
anasemble-core = { path = "../anasemble-core", version = "0.1.0-rc.3" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"
